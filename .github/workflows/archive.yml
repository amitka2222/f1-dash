name: Refresh archive

# Races run on Sundays, so a Monday morning rebuild picks up the new results
# (and the updated championship standings) once per weekend. The build makes
# ~400 throttled upstream requests, so running it more often than this would be
# rude to a free, community-funded API.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild archive
        env:
          # Kept in repository secrets so the upstream host is not committed,
          # matching how the Worker hides it at runtime.
          HISTORY_API: ${{ secrets.HISTORY_API }}
        run: node scripts/build-archive.mjs

      - name: Commit if the archive changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Archive unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh F1 archive [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Ship the refreshed data. Without this the commit above would never deploy,
  # since pushes made with GITHUB_TOKEN do not trigger the push workflow.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
