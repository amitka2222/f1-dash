name: Deploy to Pages

# Publishes public/ to GitHub Pages. No build step — the site is plain HTML, CSS
# and ES modules, and its data is committed as static JSON.
#
# Exposed as workflow_call so the archive refresh can publish its own output: a
# push made with GITHUB_TOKEN does not re-trigger workflows, so a data-only
# commit would otherwise never reach the live site.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
